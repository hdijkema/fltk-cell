name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        css: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev libpng-dev libjpeg-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DFLTK_BACKEND_WAYLAND=OFF -DFLTK_CELL_WITH_CSS=${{ matrix.css }}
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Install package
        run: cmake --install build/ci --config Release --prefix build/install
      - name: Check installed package
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install" -DUSE_CSS=${{ matrix.css }}
      - name: Build consumer
        run: cmake --build build/consumer --config Release --parallel 2
      - name: Test consumer
        run: ctest --test-dir build/consumer -C Release --output-on-failure

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish tested source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*$/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
